name: Gear deals (daily)
on:
  schedule:
    - cron: "0 15 * * *"   # 7am Pacific (8am during daylight time)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python gear_tracker.py
        env:
          GSA_API_KEY: ${{ secrets.GSA_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      - name: Save seen lots
        run: |
          git config user.name "gear-tracker-bot"
          git config user.email "gear-tracker-bot@users.noreply.github.com"
          git add seen.json digest.md
          git diff --cached --quiet || git commit -m "Update seen lots"
          git push
