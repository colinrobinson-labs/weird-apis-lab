<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Salu Atlas</title>
<meta name="description" content="Free travel health briefing for any city: heat, UV, air, pollen, storms, ocean, altitude, earthquakes, travel advisories and outbreaks, with what to do about each and how reliable each source is.">
<meta name="theme-color" content="#ecebe5">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..800;1,6..72,400..600&family=Schibsted+Grotesk:wght@400..800&family=Martian+Mono:wght@300..600&display=swap">
<style>
:root{
  --paper:#ecebe5;--sheet:#f7f6f1;--ink:#14161a;--ink2:#3a3e45;--mute:#6c7078;--rule:#d3d1c7;--rule2:#c2c0b4;
  --cobalt:#2b45c8;--ocean:#dfe3e4;--land:#f7f6f1;--coast:#5d6168;--night:rgba(20,22,40,.13);
  --l0:#2f7a64;--l1:#c48a00;--l2:#dd5418;--l3:#b0102c;--nd:#9a9ca1;
  --serif:"Newsreader","Iowan Old Style","Hiragino Mincho ProN","Songti SC","Noto Serif CJK",Georgia,serif;
  --sans:"Schibsted Grotesk","Hiragino Sans","PingFang SC","Apple SD Gothic Neo","Noto Sans CJK JP","Malgun Gothic",system-ui,sans-serif;
  --mono:"Martian Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --gut:max(16px,env(safe-area-inset-left,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0d0f12;--sheet:#14171b;--ink:#ecebe5;--ink2:#c6c7c9;--mute:#8d9097;--rule:#262a30;--rule2:#343941;--cobalt:#8ea0ff;--ocean:#12161c;--land:#1d2127;--coast:#5a606a;--night:rgba(0,0,0,.35);--l0:#4fbf9b;--l1:#f0b929;--l2:#ff7a3d;--l3:#ff4d68;--nd:#6b6f76;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0d0f12;--sheet:#14171b;--ink:#ecebe5;--ink2:#c6c7c9;--mute:#8d9097;--rule:#262a30;--rule2:#343941;--cobalt:#8ea0ff;--ocean:#12161c;--land:#1d2127;--coast:#5a606a;--night:rgba(0,0,0,.35);--l0:#4fbf9b;--l1:#f0b929;--l2:#ff7a3d;--l3:#ff4d68;--nd:#6b6f76;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--sans);padding:0 var(--gut);overflow-x:hidden}
::selection{background:var(--cobalt);color:var(--paper)}
a{color:var(--cobalt);text-decoration-thickness:1px;text-underline-offset:3px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px;border-radius:2px}
.wrap{max-width:1240px;margin:0 auto}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.02em}
.k{font:500 10.5px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
:lang(ja) .k,:lang(zh) .k,:lang(ko) .k{letter-spacing:.02em;font-family:var(--sans);font-size:11.5px;font-weight:600}

/* masthead */
.mast{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 12px;border-bottom:1px solid var(--ink)}
.mark{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.mark svg{width:28px;height:28px;flex:none}
.mark b{font:700 21px/1 var(--serif);letter-spacing:-.01em}
.mark b i{font-style:italic;font-weight:500}
.mark .ed{font:400 10px var(--mono);color:var(--mute);border-left:1px solid var(--rule2);padding-left:10px;margin-left:2px;letter-spacing:.06em}
.ctl{display:flex;gap:8px;align-items:center}
.sel{position:relative}
.sel select{appearance:none;-webkit-appearance:none;background:transparent;border:1px solid var(--rule2);border-radius:999px;padding:6px 28px 6px 12px;font:500 13px var(--sans);min-height:34px}
.sel::after{content:"";position:absolute;right:12px;top:50%;width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:translateY(-70%) rotate(45deg);pointer-events:none}
.seg{display:inline-flex;border:1px solid var(--rule2);border-radius:999px;padding:2px;min-height:34px;align-items:center}
.seg button{border:0;background:transparent;border-radius:999px;padding:4px 10px;font:500 12px var(--mono);color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.ib{width:34px;height:34px;border:1px solid var(--rule2);border-radius:50%;background:transparent;display:grid;place-items:center;padding:0}
.ib svg{width:16px;height:16px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:40px;align-items:center;padding:44px 0 36px}
.hero .kick{display:flex;gap:10px;align-items:center;margin-bottom:18px}
.hero .kick .dot{width:7px;height:7px;border-radius:50%;background:var(--l0);box-shadow:0 0 0 0 var(--l0);animation:live 2.4s infinite}
@keyframes live{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--l0) 60%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
h1{font:500 clamp(40px,6.4vw,86px)/.95 var(--serif);letter-spacing:-.03em;margin:0;max-width:11ch;font-variation-settings:"opsz" 72}
h1 em{font-style:italic;font-weight:400;color:var(--cobalt)}
:lang(ja) h1,:lang(zh) h1,:lang(ko) h1{font-family:var(--sans);font-weight:800;letter-spacing:-.01em;line-height:1.15;max-width:none;font-size:clamp(32px,4.8vw,62px);word-break:keep-all}
:lang(ja) h1{word-break:auto-phrase}
:lang(ja) h1 em,:lang(zh) h1 em,:lang(ko) h1 em{font-style:normal}
h1 .w{display:inline-block;opacity:0;transform:translateY(.35em);animation:rise .8s cubic-bezier(.2,.7,.1,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.lede{font:400 18px/1.45 var(--serif);color:var(--ink2);max-width:46ch;margin:20px 0 0}
:lang(ja) .lede,:lang(zh) .lede,:lang(ko) .lede{font-family:var(--sans);font-size:16px;line-height:1.7}

/* the form: a ticket */
.ticket{margin-top:28px;background:var(--sheet);border:1px solid var(--ink);border-radius:4px;position:relative;box-shadow:6px 6px 0 var(--ink)}
.ticket .f{padding:14px 16px 12px}
.ticket .f+.f{border-top:1px dashed var(--rule2)}
.ticket label.k{display:block;margin-bottom:6px}
.search{position:relative}
.search input{width:100%;border:0;background:transparent;font:500 26px/1.15 var(--serif);padding:2px 0;outline:none;letter-spacing:-.01em}
:lang(ja) .search input,:lang(zh) .search input,:lang(ko) .search input{font-family:var(--sans);font-size:21px}
.search input::placeholder{color:var(--mute);opacity:.7;font-style:italic}
.search .go{position:absolute;right:0;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);display:grid;place-items:center}
.search .go svg{width:16px;height:16px}
.sugg{position:absolute;top:calc(100% + 14px);left:-17px;right:-17px;z-index:20;background:var(--sheet);border:1px solid var(--ink);border-radius:4px;box-shadow:6px 6px 0 var(--ink);overflow:hidden}
.sugg button{display:flex;justify-content:space-between;align-items:baseline;gap:10px;width:100%;text-align:left;border:0;background:transparent;border-bottom:1px solid var(--rule);padding:12px 16px;font-size:15px}
.sugg button:last-child{border-bottom:0}
.sugg button[aria-selected="true"],.sugg button:hover{background:color-mix(in srgb,var(--cobalt) 10%,var(--sheet))}
.sugg small{color:var(--mute);font:11px var(--mono);white-space:nowrap}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:0}
.dates>div+div{border-left:1px dashed var(--rule2);padding-left:16px}
.dates input{border:0;background:transparent;font:500 15px var(--mono);padding:2px 0;width:100%;min-width:0;outline:none}
.dates input::-webkit-calendar-picker-indicator{opacity:.6}
.who{display:flex;gap:6px;flex-wrap:wrap}
.who label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule2);border-radius:999px;padding:5px 11px 5px 9px;font-size:13px;cursor:pointer;transition:background .15s,border-color .15s;user-select:none}
.who label::before{content:"";width:10px;height:10px;border-radius:50%;border:1.5px solid var(--mute);transition:all .15s}
.who label:has(input:checked){border-color:var(--ink);background:var(--ink);color:var(--paper)}
.who label:has(input:checked)::before{background:var(--cobalt);border-color:var(--cobalt)}
.who label:has(input:focus-visible){outline:2px solid var(--cobalt);outline-offset:2px}
.who input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;left:0;top:0}
.who label{position:relative}
.ex{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:baseline;margin-top:18px}
.ex button{border:0;background:none;padding:2px 0;font:italic 400 16px var(--serif);color:var(--ink2);border-bottom:1px solid var(--rule2)}
:lang(ja) .ex button,:lang(zh) .ex button,:lang(ko) .ex button{font-family:var(--sans);font-style:normal;font-size:14px}
.ex button:hover{color:var(--cobalt);border-color:var(--cobalt)}

/* globe */
.plate{position:relative;aspect-ratio:1;width:100%;max-width:560px;justify-self:end}
.plate canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.plate canvas:active{cursor:grabbing}
.plate .cap{position:absolute;left:0;bottom:4%;display:grid;gap:2px;pointer-events:none}
.plate .cap b{font:500 12px var(--mono);color:var(--ink)}
.plate .tick{position:absolute;right:0;top:4%;text-align:right;pointer-events:none}

/* status ticker */
.status{border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);display:flex;gap:0;overflow-x:auto;scrollbar-width:none;margin-top:8px}
.status::-webkit-scrollbar{display:none}
.status span{flex:none;display:flex;align-items:center;gap:7px;padding:9px 14px 9px 0;margin-right:14px;font:400 11px var(--mono);color:var(--mute);white-space:nowrap}
.status span i{width:7px;height:7px;border-radius:50%;background:var(--rule2)}
.status span.wait i{animation:blink .9s infinite alternate}
.status span.ok{color:var(--ink2)}.status span.ok i{background:var(--l0)}
.status span.bad i{background:var(--l3)}
.status span em{font-style:normal;color:var(--mute)}
@keyframes blink{to{opacity:.2}}

/* briefing */
#result{min-height:200px}
.brief{padding:30px 0 0}
.bh{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;padding-bottom:22px;border-bottom:1px solid var(--ink)}
.bh h2{font:500 clamp(44px,8vw,112px)/.9 var(--serif);letter-spacing:-.035em;margin:10px 0 0;font-variation-settings:"opsz" 72;overflow-wrap:anywhere}
:lang(ja) .bh h2,:lang(zh) .bh h2,:lang(ko) .bh h2{font-family:var(--sans);font-weight:800;letter-spacing:-.01em;line-height:1.05}
.bh h2 small{display:block;font:italic 400 .3em/1.2 var(--serif);letter-spacing:0;color:var(--ink2);margin-top:.35em}
:lang(ja) .bh h2 small,:lang(zh) .bh h2 small,:lang(ko) .bh h2 small{font-family:var(--sans);font-style:normal;font-weight:500}
.stamp{border:2px solid var(--c);color:var(--c);padding:12px 16px 12px;min-width:230px;position:relative;background:color-mix(in srgb,var(--c) 7%,transparent)}
.stamp .k{color:var(--c)}
.stamp b{display:block;font:600 28px/1.05 var(--serif);margin:6px 0 4px;letter-spacing:-.01em}
:lang(ja) .stamp b,:lang(zh) .stamp b,:lang(ko) .stamp b{font-family:var(--sans);font-weight:800;font-size:24px}
.stamp p{margin:0;font-size:13px;color:var(--ink2);max-width:30ch}
.stamp .acts{display:flex;gap:6px;margin-top:10px}
.btn{border:1px solid var(--ink);background:transparent;border-radius:999px;padding:6px 12px;font:500 12.5px var(--sans);display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn svg{width:13px;height:13px}
.note{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink2);border-bottom:1px solid var(--rule);padding:11px 0}
.note::before{content:"i";flex:none;width:18px;height:18px;border-radius:50%;border:1px solid currentColor;font:600 11px/16px var(--serif);text-align:center;font-style:italic}
.alarm{background:var(--l3);color:#fff;padding:12px 16px;margin:14px 0 0;font-weight:600;display:flex;gap:10px;align-items:center}
.alarm::before{content:"";width:10px;height:10px;background:#fff;transform:rotate(45deg);flex:none}

.grid2{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:0;border-bottom:1px solid var(--ink)}
.grid2>section{padding:26px 0 28px}
.grid2>section+section{border-left:1px solid var(--rule);padding-left:32px}
.grid2>section:first-child{padding-right:32px}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
.sh h3{font:500 26px/1.1 var(--serif);margin:0;letter-spacing:-.01em}
:lang(ja) .sh h3,:lang(zh) .sh h3,:lang(ko) .sh h3{font-family:var(--sans);font-weight:700;font-size:21px}
.sh .k{text-align:right}

/* compass */
.compass{width:100%;max-width:470px;margin:0 auto;display:block;overflow:visible}
.compass .ring{fill:none;stroke:var(--rule)}
.compass .ring.r3{stroke:var(--rule2)}
.compass .spoke{stroke:var(--c);stroke-width:9;stroke-linecap:butt;transition:stroke-width .2s}
.compass .spoke.nd{stroke:var(--nd);stroke-dasharray:2 3;stroke-width:6}
.compass .tip{fill:var(--c)}
.compass g.s{cursor:pointer}
.compass g.s:hover .spoke,.compass g.s:focus .spoke{stroke-width:13}
.compass g.s:focus{outline:none}
.compass text{font:500 13px var(--sans);fill:var(--ink2)}
.compass text.lv{font:500 8.5px var(--mono);fill:var(--mute)}
.compass .ctr{font:600 15px var(--serif);fill:var(--ink)}
.compass .grow{transform-box:fill-box;transform-origin:var(--ox) var(--oy)}
.compass line.spoke{stroke-dasharray:var(--len) var(--len);stroke-dashoffset:var(--len);animation:draw 1s cubic-bezier(.3,.8,.2,1) forwards;animation-delay:var(--d)}
.compass line.spoke.nd{animation:none;stroke-dashoffset:0;stroke-dasharray:2 3}
@keyframes draw{to{stroke-dashoffset:0}}
.compass .tip{opacity:0;animation:pop .3s ease forwards;animation-delay:calc(var(--d) + .7s)}
@keyframes pop{to{opacity:1}}
.key{display:flex;gap:6px 14px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.key span{display:flex;align-items:center;gap:6px;font:400 10.5px var(--mono);color:var(--mute)}
.key span::before{content:"";width:14px;height:5px;background:var(--c)}

/* to-do */
.todo{list-style:none;margin:0;padding:0;counter-reset:t}
.todo li{counter-increment:t;display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px 10px;padding:12px 0;border-top:1px solid var(--rule);align-items:start}
.todo li:first-child{border-top:0;padding-top:4px}
.todo li::before{content:counter(t,decimal-leading-zero);font:500 12px/22px var(--mono);color:var(--mute)}
.todo li b{font:500 17px/1.35 var(--serif);display:block}
:lang(ja) .todo li b,:lang(zh) .todo li b,:lang(ko) .todo li b{font-family:var(--sans);font-size:15px;font-weight:600;line-height:1.55}
.todo li small{grid-column:2;display:flex;align-items:center;gap:6px;font:400 10.5px var(--mono);color:var(--c);text-transform:uppercase;letter-spacing:.05em}
.todo li small::before{content:"";width:8px;height:8px;background:var(--c)}
.calm{font:italic 400 20px/1.4 var(--serif);color:var(--ink2);margin:0}

/* day chart */
.days{padding:26px 0 24px;border-bottom:1px solid var(--ink)}
.chart{overflow-x:auto;scrollbar-width:thin;margin:0 calc(var(--gut)*-1);padding:0 var(--gut);-webkit-overflow-scrolling:touch}
.chart svg{display:block;min-width:100%}
.chart text{font:400 10px var(--mono);fill:var(--mute)}
.chart text.v{fill:var(--ink);font-weight:500}
.chart text.dl{fill:var(--ink2);font-weight:500;font-size:10.5px}
.chart text.rl{fill:var(--ink2);font:500 10.5px var(--sans)}
.chart .band{fill:var(--c);opacity:.09}
.chart .bandl{stroke:var(--c);stroke-dasharray:2 3;opacity:.7}
.chart .range{fill:var(--ink);opacity:.06}
.chart .hi{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:dash 1.6s .2s cubic-bezier(.3,.8,.2,1) forwards}
.chart .lo{fill:none;stroke:var(--mute);stroke-width:1;stroke-dasharray:3 3}
@keyframes dash{to{stroke-dashoffset:0}}
.chart .pt{fill:var(--c);stroke:var(--sheet);stroke-width:2}
.chart .cell{fill:var(--c);opacity:.22}
.chart .cellb{fill:var(--c)}
.chart .grid{stroke:var(--rule)}
.chart .today{stroke:var(--cobalt);stroke-width:1}

/* ledger */
.ledger{padding:26px 0 10px}
.risk{border-top:1px solid var(--rule);opacity:0;transform:translateY(10px);transition:opacity .5s,transform .5s cubic-bezier(.2,.7,.1,1)}
.risk.in{opacity:1;transform:none}
.risk:last-child{border-bottom:1px solid var(--rule)}
.risk.flash{animation:flash 1.2s}
@keyframes flash{0%,40%{background:color-mix(in srgb,var(--c) 14%,transparent)}100%{background:transparent}}
.rh{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:52px minmax(130px,190px) minmax(0,1fr) 150px 36px 18px;gap:16px;align-items:center;width:100%;padding:15px 0}
.rh:focus-visible{outline:2px solid var(--cobalt);outline-offset:-2px}
.lvb{display:flex;gap:2px;align-items:flex-end;height:18px}
.lvb i{width:10px;background:var(--rule2)}
.lvb i:nth-child(1){height:6px}.lvb i:nth-child(2){height:10px}.lvb i:nth-child(3){height:14px}.lvb i:nth-child(4){height:18px}
.lvb i.on{background:var(--c)}
.lvb.nd i{background:none;border:1px dashed var(--nd)}
.rn{font:500 20px/1.15 var(--serif);letter-spacing:-.005em}
:lang(ja) .rn,:lang(zh) .rn,:lang(ko) .rn{font-family:var(--sans);font-weight:700;font-size:16px}
.rv{color:var(--ink2);font-size:14.5px;line-height:1.4}
.rv small{display:block;color:var(--mute);font-size:12.5px;margin-top:2px}
.rl{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--c);text-align:right}
:lang(ja) .rl,:lang(zh) .rl,:lang(ko) .rl{font-family:var(--sans);font-weight:700;font-size:12px;letter-spacing:0}
.gr{width:26px;height:26px;border:1px solid var(--ink2);border-radius:50%;display:grid;place-items:center;font:600 11px var(--mono);color:var(--ink2);justify-self:end}
.gr.D{border-style:dashed;color:var(--mute);border-color:var(--mute)}
.chev{width:10px;height:10px;border-right:1.5px solid var(--mute);border-bottom:1.5px solid var(--mute);transform:rotate(45deg) translate(-2px,-2px);transition:transform .25s}
.risk.open .chev{transform:rotate(225deg) translate(-2px,-2px)}
.rb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.2,.7,.1,1)}
.risk.open .rb{grid-template-rows:1fr}
.rb>div{overflow:hidden}
.rbi{display:grid;grid-template-columns:52px minmax(130px,190px) minmax(0,1fr) 222px;gap:16px;padding:0 0 18px}
.rbi .acts{grid-column:3;list-style:none;margin:0;padding:0;display:grid;gap:2px}
.acts li label{display:grid;grid-template-columns:20px 1fr;gap:10px;align-items:start;padding:5px 0;cursor:pointer;font-size:14.5px;line-height:1.45}
.acts input{appearance:none;-webkit-appearance:none;width:16px;height:16px;border:1.5px solid var(--ink2);border-radius:3px;margin:2px 0 0;display:grid;place-items:center;background:transparent;cursor:pointer}
.acts input:checked{background:var(--ink);border-color:var(--ink)}
.acts input:checked::after{content:"";width:8px;height:4px;border-left:2px solid var(--paper);border-bottom:2px solid var(--paper);transform:rotate(-45deg) translate(1px,-1px)}
.acts input:checked+span{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--rule2)}
.acts .plain{font-size:14.5px;color:var(--ink2);padding:5px 0}
.ext{grid-column:3;margin:6px 0 0;padding:0;list-style:none;font-size:13.5px;display:grid;gap:4px}
.ext li::before{content:"↗ ";color:var(--mute)}
.prov{grid-column:4;grid-row:1/span 2;font:400 11px/1.6 var(--mono);color:var(--mute);border-left:1px solid var(--rule);padding-left:14px;align-self:start}
.prov a{color:var(--ink2)}
.prov b{color:var(--ink2);font-weight:500}
.lh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:22px 0 8px}
.lh h4{margin:0;font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
:lang(ja) .lh h4,:lang(zh) .lh h4,:lang(ko) .lh h4{font-family:var(--sans);font-weight:700;font-size:12px}

/* emergency & guides */
.after{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-top:1px solid var(--ink);margin-top:28px}
.after>section{padding:26px 0 30px}
.after>section+section{border-left:1px solid var(--rule);padding-left:32px}
.after>section:first-child{padding-right:32px}
.nums{display:flex;gap:28px;flex-wrap:wrap;margin:6px 0 12px}
.nums a{text-decoration:none;color:var(--ink);display:grid;gap:2px}
.nums a b{font:500 clamp(40px,6vw,64px)/1 var(--serif);letter-spacing:-.02em;color:var(--l3)}
.nums a span{font-size:13px;color:var(--ink2)}
.after p{margin:0 0 10px;color:var(--ink2);font-size:14.5px}
.guides{list-style:none;margin:12px 0 0;padding:0}
.guides a{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--rule);text-decoration:none;color:var(--ink);font:500 17px var(--serif)}
:lang(ja) .guides a,:lang(zh) .guides a,:lang(ko) .guides a{font-family:var(--sans);font-size:15px}
.guides a:hover{color:var(--cobalt)}
.guides a::after{content:"↗";font-family:var(--mono);color:var(--mute)}

/* skeleton */
.sk{padding:30px 0}
.sk i{display:block;background:linear-gradient(90deg,var(--rule) 0,color-mix(in srgb,var(--rule) 40%,var(--paper)) 50%,var(--rule) 100%);background-size:200% 100%;animation:sh 1.3s linear infinite;border-radius:2px}
@keyframes sh{to{background-position:-200% 0}}

/* method & foot */
.method{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px;border-top:1px solid var(--ink);padding:28px 0 10px;margin-top:40px}
.method h3{font:500 21px/1.2 var(--serif);margin:0 0 8px}
:lang(ja) .method h3,:lang(zh) .method h3,:lang(ko) .method h3{font-family:var(--sans);font-weight:700;font-size:17px}
.method p{margin:0;color:var(--ink2);font-size:14px}
.grades{display:grid;gap:8px;margin-top:4px}
.grades div{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:center;font-size:13.5px;color:var(--ink2)}
footer{border-top:1px solid var(--rule);margin-top:28px;padding:16px 0 calc(28px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;transition:all .25s;pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- tablet ---------- */
@media (max-width:980px){
  .hero{grid-template-columns:minmax(0,1fr);gap:8px;padding-top:28px}
  .plate{order:-1;max-width:360px;justify-self:center;margin:-6px 0 -10px}
  .plate .cap,.plate .tick{display:none}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .grid2>section+section{border-left:0;padding-left:0;border-top:1px solid var(--rule)}
  .grid2>section:first-child{padding-right:0}
  .rh{grid-template-columns:44px minmax(110px,160px) minmax(0,1fr) 120px 30px 14px;gap:12px}
  .rbi{grid-template-columns:44px minmax(0,1fr) 200px;gap:12px}
  .rbi .acts,.ext{grid-column:2}
  .prov{grid-column:3}
  .method{grid-template-columns:minmax(0,1fr);gap:22px}
}
/* ---------- phone ---------- */
@media (max-width:640px){
  body{font-size:15px}
  .mast{padding:10px 0}
  .mark b{font-size:19px}.mark .ed{display:none}
  .ctl{gap:6px}
  .sel select{padding:5px 24px 5px 10px;font-size:12.5px;max-width:110px}
  .seg button{padding:4px 8px}
  .hero{padding:14px 0 22px}
  .plate{max-width:300px;width:78vw}
  .hero .kick{margin-bottom:12px}
  h1{font-size:clamp(40px,12.4vw,56px);max-width:none}
  :lang(ja) h1,:lang(zh) h1,:lang(ko) h1{font-size:clamp(28px,8.4vw,40px)}
  .lede{font-size:16.5px;margin-top:14px}
  .ticket{margin-top:22px;box-shadow:4px 4px 0 var(--ink)}
  .ticket .f{padding:12px 14px 11px}
  .search input{font-size:22px;padding-right:44px}
  .sugg{left:-15px;right:-15px;box-shadow:4px 4px 0 var(--ink)}
  .dates>div+div{padding-left:12px}
  .dates input{font-size:14px}
  .who{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px 2px}
  .who::-webkit-scrollbar{display:none}
  .who label{flex:none;white-space:nowrap;padding:7px 12px 7px 10px}
  .ex{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:16px calc(var(--gut)*-1) 0;padding:0 var(--gut)}
  .ex::-webkit-scrollbar{display:none}
  .ex button,.ex span{flex:none}
  .brief{padding-top:22px}
  .bh{grid-template-columns:minmax(0,1fr);gap:16px}
  .bh h2{font-size:clamp(46px,14vw,72px)}
  .stamp{min-width:0;width:100%}
  .stamp .acts .btn{flex:1;justify-content:center;padding:9px 12px}
  .grid2>section{padding:22px 0}
  .sh{flex-direction:column;gap:4px;align-items:flex-start}.sh .k{text-align:left}
  .sh h3{font-size:23px}
  .compass text{font-size:16px}
  .todo li small{font-size:10px}
  .compass{max-width:340px}
  .todo li b{font-size:16.5px}
  .rh{grid-template-columns:40px minmax(0,1fr) auto 26px;grid-template-areas:"b n l g" ". v v v";gap:3px 10px;padding:14px 0}
  .rh .lvb{grid-area:b}.rh .rn{grid-area:n}.rh .rl{grid-area:l}.rh .gr{grid-area:g;width:24px;height:24px;font-size:10px}.rh .rv{grid-area:v}.rh .chev{display:none}
  .rn{font-size:18.5px}
  .rv{font-size:14px}
  .rbi{grid-template-columns:40px minmax(0,1fr);gap:0 10px;padding-bottom:16px}
  .rbi .acts,.ext{grid-column:2}
  .prov{grid-column:2;grid-row:auto;border-left:0;padding-left:0;border-top:1px dashed var(--rule);padding-top:8px;margin-top:10px}
  .acts li label{font-size:15px;padding:7px 0}
  .after{grid-template-columns:minmax(0,1fr)}
  .after>section+section{border-left:0;padding-left:0;border-top:1px solid var(--rule)}
  .after>section:first-child{padding-right:0}
  .nums{gap:22px}
  .guides a{font-size:16px;padding:13px 0}
  footer{flex-direction:column;gap:6px}
}
@media print{
  .mast .ctl,.hero,.status,.stamp .acts,.method,.ex{display:none!important}
  body{background:#fff}.risk{opacity:1!important;transform:none!important;break-inside:avoid}.rb{grid-template-rows:1fr!important}
}

<body>
<div class="wrap">
  <header class="mast">
    <a class="mark" href="./" aria-label="Salu Atlas">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14.5" fill="none" stroke="currentColor" stroke-width="1.5"/><ellipse cx="16" cy="16" rx="6.5" ry="14.5" fill="none" stroke="currentColor" stroke-width="1"/><path d="M1.5 16h29" stroke="currentColor" stroke-width="1"/><path d="M16 9.5v13M9.5 16h13" stroke="var(--l3)" stroke-width="3.2"/></svg>
      <b>Salu <i>Atlas</i></b><span class="ed" id="edition"></span>
    </a>
    <div class="ctl">
      <div class="sel"><select id="lang" aria-label="Language"></select></div>
      <div class="seg" id="units" role="group" aria-label="Units"><button data-u="m">°C</button><button data-u="i">°F</button></div>
      <button class="ib" id="theme" aria-label="Dark / light"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg></button>
    </div>
  </header>

  <div class="hero">
    <div>
      <div class="kick"><span class="dot"></span><span class="k" data-t="kicker"></span></div>
      <h1 id="h1"></h1>
      <p class="lede" data-t="sub"></p>
      <div class="ticket">
        <div class="f">
          <label class="k" for="q" data-t="whereT"></label>
          <div class="search">
            <input id="q" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="sugg" aria-autocomplete="list" enterkeyhint="search">
            <button class="go" id="go" aria-label="Search"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8h11M9 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
            <div class="sugg" id="sugg" role="listbox" hidden></div>
          </div>
        </div>
        <div class="f dates">
          <div><label class="k" for="d1" data-t="from"></label><input type="date" id="d1"></div>
          <div><label class="k" for="d2" data-t="to"></label><input type="date" id="d2"></div>
        </div>
        <div class="f">
          <span class="k" data-t="forT" style="display:block;margin-bottom:8px"></span>
          <div class="who" id="who">
            <label><input type="checkbox" value="kids"><span data-g="kids"></span></label>
            <label><input type="checkbox" value="older"><span data-g="older"></span></label>
            <label><input type="checkbox" value="pregnant"><span data-g="pregnant"></span></label>
            <label><input type="checkbox" value="lungs"><span data-g="lungs"></span></label>
            <label><input type="checkbox" value="allergy"><span data-g="allergy"></span></label>
          </div>
        </div>
      </div>
      <div class="ex" id="ex"><span class="k" data-t="tryT"></span></div>
    </div>
    <div class="plate">
      <canvas id="globe" aria-hidden="true"></canvas>
      <div class="tick k" id="gtick"></div>
      <div class="cap"><span class="k" data-t="globeCap"></span><b id="gcoord">—</b></div>
    </div>
  </div>

  <div class="status" id="status" aria-live="polite"></div>
  <div id="result"></div>

  <section class="method">
    <div><h3 data-t="howT"></h3><p data-th="howP"></p></div>
    <div><h3 data-t="gradeT"></h3><div class="grades" id="grades"></div></div>
    <div><h3 data-t="nextT"></h3><p data-t="nextP"></p></div>
  </section>
  <footer><span class="k" data-t="foot"></span><span class="k" data-t="data"></span></footer>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="geo.js"></script>
<script src="i18n.js"></script>
<script>
(()=>{
"use strict";
const T=window.SALU_T,$=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fill=(s,o)=>String(s).replace(/\{(\w+)\}/g,(_,k)=>o[k]??"");
const COL=["var(--l0)","var(--l1)","var(--l2)","var(--l3)","var(--nd)"];
const DAY=864e5,iso=d=>d.toISOString().slice(0,10),addD=(s,n)=>iso(new Date(Date.parse(s)+n*DAY)),daysBetween=(a,b)=>Math.round((Date.parse(b)-Date.parse(a))/DAY);
const TODAY=iso(new Date());
const RM=matchMedia("(prefers-reduced-motion:reduce)").matches;
const P=new URLSearchParams(location.search);
const LANGS=Object.keys(T);
const pickLang=()=>{const want=[P.get("lang"),...(navigator.languages||[navigator.language||"en"])].filter(Boolean).map(x=>x.toLowerCase().slice(0,2));return want.find(x=>T[x])||"en"};
let lang=pickLang();
let units=P.get("u")||(/^en-(US|LR|MM)$/.test(navigator.language||"")?"i":"m");
let last=null;
const t=()=>T[lang];
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(_){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}}};

/* ---------- formatting ---------- */
const nf=(n,d=0)=>Number(n).toLocaleString(lang,{maximumFractionDigits:d,minimumFractionDigits:d});
const fT=c=>units==="i"?`${nf(c*9/5+32)}°F`:`${nf(c)}°C`;
const fTn=c=>units==="i"?nf(c*9/5+32):nf(c);
const fSpd=k=>units==="i"?`${nf(k*.6214)} mph`:`${nf(k)} km/h`;
const fMM=mm=>units==="i"?`${nf(mm/25.4,1)} in`:`${nf(mm)} mm`;
const fM=m=>units==="i"?`${nf(m*3.281)} ft`:`${nf(m)} m`;
const fWave=m=>units==="i"?`${nf(m*3.281,1)} ft`:`${nf(m,1)} m`;
const fKm=k=>units==="i"?`${nf(k*.6214)} mi`:`${nf(k)} km`;
const fDate=(s,o={month:"short",day:"numeric"})=>new Intl.DateTimeFormat(lang,{...o,timeZone:"UTC"}).format(new Date(s+"T00:00:00Z"));
const fRange=(a,b)=>{try{return new Intl.DateTimeFormat(lang,{month:"short",day:"numeric",year:"numeric",timeZone:"UTC"}).formatRange(new Date(a+"T00:00:00Z"),new Date(b+"T00:00:00Z"))}catch(_){return fDate(a)+" – "+fDate(b,{month:"short",day:"numeric",year:"numeric"})}};
const fLat=(la,lo)=>`${nf(Math.abs(la),2)}°${la>=0?"N":"S"}  ${nf(Math.abs(lo),2)}°${lo>=0?"E":"W"}`;
const region=(cc,l)=>{try{return new Intl.DisplayNames([l],{type:"region"}).of(cc)}catch(_){return cc}};

/* ---------- static UI ---------- */
function applyLang(){
  const s=t();document.documentElement.lang=lang;document.title=s.title;
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=s[e.dataset.t]??"");
  document.querySelectorAll("[data-th]").forEach(e=>e.innerHTML=s[e.dataset.th]??"");
  document.querySelectorAll("[data-g]").forEach(e=>e.textContent=s.g[e.dataset.g]);
  $("q").placeholder=s.ph;$("lang").value=lang;$("edition").textContent=s.edition;
  document.querySelectorAll("[data-ex]").forEach(b=>b.textContent=exName(b.dataset.ex));
  // headline: words reveal; {em} wraps the accent part
  const parts=s.hero.split(/(\*[^*]+\*)/).filter(Boolean);let i=0;
  const seg=str=>(lang==="ja"||lang==="zh")?[str]:str.split(/(\s+)/);
  $("h1").innerHTML=parts.map(p=>{const em=p.startsWith("*");const txt=em?p.slice(1,-1):p;const w=seg(txt).map(x=>/^\s+$/.test(x)?x:`<span class="w" style="animation-delay:${(i++)*70}ms">${esc(x)}</span>`).join("");return em?`<em>${w}</em>`:w}).join("");
  $("grades").innerHTML=["A","B","C","D"].map(g=>`<div><span class="gr ${g}">${g}</span><span>${esc(s.gradeW[g])}</span></div>`).join("");
  if(last&&last.cards)render();else if(last)statusBar();
  drawGlobe();
}
LANGS.forEach(k=>{const o=document.createElement("option");o.value=k;o.textContent=T[k].n;$("lang").appendChild(o)});
$("lang").onchange=e=>{lang=e.target.value;applyLang();syncURL()};
document.querySelectorAll("#units button").forEach(b=>b.onclick=()=>{units=b.dataset.u;markUnits();if(last&&last.cards)render();syncURL()});
const markUnits=()=>document.querySelectorAll("#units button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.u===units));
$("theme").onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dark?"light":"dark";store.set("salu.theme",r.dataset.theme);readColors();drawGlobe();document.querySelector('meta[name=theme-color]').content=getComputedStyle(r).getPropertyValue("--paper").trim()};
{const th=store.get("salu.theme");if(th)document.documentElement.dataset.theme=th}

$("d1").value=P.get("s")&&P.get("s")>=TODAY?P.get("s"):TODAY;$("d2").value=P.get("e")&&P.get("e")>=$("d1").value?P.get("e"):addD($("d1").value,6);$("d1").min=TODAY;$("d2").min=TODAY;
const fixDates=()=>{if($("d1").value<TODAY)$("d1").value=TODAY;if(!$("d2").value||$("d2").value<$("d1").value)$("d2").value=$("d1").value;if(daysBetween($("d1").value,$("d2").value)>29)$("d2").value=addD($("d1").value,29);$("d2").min=$("d1").value};
["d1","d2"].forEach(id=>$(id).onchange=()=>{fixDates();last&&check(last.place)});
(P.get("g")||"").split(",").forEach(g=>{const i=document.querySelector(`#who input[value="${g}"]`);if(i)i.checked=true});
document.querySelectorAll("#who input").forEach(i=>i.onchange=()=>last&&check(last.place));
const groups=()=>new Set([...document.querySelectorAll("#who input:checked")].map(i=>i.value));
const sensitive=g=>g.has("kids")||g.has("older")||g.has("pregnant")||g.has("lungs");

const get=async(u,ms=12000)=>{const c=new AbortController(),tm=setTimeout(()=>c.abort(),ms);try{const r=await fetch(u,{signal:c.signal});if(!r.ok)throw new Error("HTTP "+r.status);return await r.json()}finally{clearTimeout(tm)}};

/* ---------- search ---------- */
let timer,sel=-1,results=[];
function showSugg(){const s=$("sugg");s.innerHTML="";results.forEach((r,i)=>{const b=document.createElement("button");b.setAttribute("role","option");b.setAttribute("aria-selected",i===sel);b.innerHTML=`<span>${esc(r.name)}${r.admin1&&r.admin1!==r.name?`<span style="color:var(--mute)">, ${esc(r.admin1)}</span>`:""}</span><small>${esc(region(r.country_code,lang)||r.country||"")}</small>`;b.onmousedown=e=>{e.preventDefault();pick(r)};b.onclick=()=>pick(r);s.appendChild(b)});
  if(!results.length&&$("q").value.trim().length>=2){s.innerHTML=`<button disabled>${esc(t().noRes)}</button>`}
  s.hidden=!s.children.length;$("q").setAttribute("aria-expanded",!s.hidden)}
function pick(r){$("sugg").hidden=true;$("q").value=r.name;$("q").blur();check({name:r.name,admin1:r.admin1||"",lat:r.latitude,lon:r.longitude,cc:r.country_code})}
async function lookup(v){try{const j=await get(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(v)}&count=7&language=${lang}`);results=(j.results||[]).filter(r=>r.country_code);sel=-1;showSugg()}catch(_){results=[];showSugg()}}
$("q").addEventListener("input",e=>{clearTimeout(timer);const v=e.target.value.trim();if(v.length<2){$("sugg").hidden=true;return}timer=setTimeout(()=>lookup(v),220)});
$("q").addEventListener("keydown",e=>{if(e.key==="Enter"&&$("sugg").hidden){lookup($("q").value.trim());return}if($("sugg").hidden)return;if(e.key==="ArrowDown"){sel=Math.min(sel+1,results.length-1);showSugg();e.preventDefault()}else if(e.key==="ArrowUp"){sel=Math.max(sel-1,0);showSugg();e.preventDefault()}else if(e.key==="Enter"){const r=results[sel<0?0:sel];if(r)pick(r);e.preventDefault()}else if(e.key==="Escape")$("sugg").hidden=true});
$("q").addEventListener("blur",()=>setTimeout(()=>$("sugg").hidden=true,180));
$("go").onclick=()=>{const v=$("q").value.trim();if(v.length>=2){results.length&&!$("sugg").hidden?pick(results[Math.max(sel,0)]):lookup(v)}else $("q").focus()};

const EX=[["Lisbon",38.7167,-9.1333,"PT"],["Bangkok",13.7563,100.5018,"TH"],["Cusco",-13.5319,-71.9675,"PE"],["Delhi",28.6519,77.2315,"IN"],["Reykjavík",64.1355,-21.8954,"IS"],["Mexico City",19.4326,-99.1332,"MX"],["Tokyo",35.6895,139.6917,"JP"]];
const EXN={
 es:{Lisbon:"Lisboa","Mexico City":"Ciudad de México",Tokyo:"Tokio",Delhi:"Delhi"},
 fr:{Lisbon:"Lisbonne","Mexico City":"Mexico",Cusco:"Cuzco",Delhi:"Delhi"},
 pt:{Lisbon:"Lisboa","Mexico City":"Cidade do México",Bangkok:"Banguecoque",Delhi:"Deli",Cusco:"Cusco",Tokyo:"Tóquio"},
 de:{Lisbon:"Lissabon","Mexico City":"Mexiko-Stadt",Cusco:"Cusco",Delhi:"Delhi"},
 it:{Lisbon:"Lisbona","Mexico City":"Città del Messico",Tokyo:"Tokyo",Delhi:"Delhi"},
 ja:{Lisbon:"リスボン",Bangkok:"バンコク",Cusco:"クスコ",Delhi:"デリー","Reykjavík":"レイキャビク","Mexico City":"メキシコシティ",Tokyo:"東京"},
 zh:{Lisbon:"里斯本",Bangkok:"曼谷",Cusco:"库斯科",Delhi:"德里","Reykjavík":"雷克雅未克","Mexico City":"墨西哥城",Tokyo:"东京"},
 ko:{Lisbon:"리스본",Bangkok:"방콕",Cusco:"쿠스코",Delhi:"델리","Reykjavík":"레이캬비크","Mexico City":"멕시코시티",Tokyo:"도쿄"}};
const exName=n=>(EXN[lang]&&EXN[lang][n])||n;
EX.forEach(([n,la,lo,cc])=>{const b=document.createElement("button");b.dataset.ex=n;b.textContent=exName(n);b.onclick=()=>{$("q").value=exName(n);check({name:n,admin1:"",lat:la,lon:lo,cc,ex:n})};$("ex").appendChild(b)});
const placeName=p=>p.ex?exName(p.ex):p.name;

function compass(ranked){
  const s=t(),items=ORDER.map(k=>ranked.find(c=>c.k===k)).filter(Boolean);const n=items.length;
  const W=440,C=W/2,r0=44,R=172,step=(R-r0)/4;
  const rings=[1,2,3,4].map(i=>`<circle class="ring${i===4?" r3":""}" cx="${C}" cy="${C}" r="${r0+step*i}"/>`).join("");
  const sp=items.map((c,i)=>{const ang=-Math.PI/2+i*2*Math.PI/n,cs=Math.cos(ang),sn=Math.sin(ang);
    const lv=c.level===4?4:c.level+1,len=c.level===4?R-r0:step*lv;
    const x1=C+cs*r0,y1=C+sn*r0,x2=C+cs*(r0+len),y2=C+sn*(r0+len);
    const lx=C+cs*(R+14),ly=C+sn*(R+14),anchor=Math.abs(cs)<.2?"middle":cs>0?"start":"end";
    return `<g class="s" data-k="${c.k}" tabindex="0" role="button" aria-label="${esc(s.names[c.k])}: ${esc(s.lv[c.level])}" style="--c:${COL[c.level]}">
      <line x1="${C+cs*r0}" y1="${C+sn*r0}" x2="${C+cs*R}" y2="${C+sn*R}" stroke="transparent" stroke-width="26"/>
      <line class="spoke${c.level===4?" nd":""}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="--len:${len.toFixed(1)};--d:${i*60}ms"/>
      ${c.level<4?`<circle class="tip" cx="${x2}" cy="${y2}" r="3.2" style="--d:${i*60}ms"/>`:""}
      <text x="${lx}" y="${ly+(sn>.5?8:sn<-.5?-2:4)}" text-anchor="${anchor}">${esc(s.short[c.k])}</text></g>`}).join("");
  const max=Math.max(0,...items.filter(c=>c.level<4).map(c=>c.level));
  return `<svg class="compass" viewBox="-40 0 ${W+80} ${W}" role="img" aria-label="${esc(s.compassT)}">${rings}
    <circle cx="${C}" cy="${C}" r="${r0-6}" fill="none" stroke="${COL[max]}" stroke-width="2"/>
    <text class="ctr" x="${C}" y="${C+5}" text-anchor="middle" style="fill:${COL[max]}">${esc(s.lvS[max])}</text>
    ${sp}</svg>`;
}
function calendar(){

  const H1=150,top=26;

  let mn=Math.min(...loV),mx=Math.max(...hiV,mn+8);mn=Math.floor(mn-2);mx=Math.ceil(mx+3);
  const y=v=>top+H1-(v-mn)/(mx-mn)*H1,x=i=>L+cw*i+cw/2;
  const bands=[[32.2,1],[39.4,2],[51.7,3]].filter(([v])=>v<mx).map(([v,l],i,a)=>{const yt=a[i+1]&&a[i+1][0]<mx?y(a[i+1][0]):top;return `<rect class="band" style="--c:${COL[l]}" x="${L}" y="${yt}" width="${cw*n}" height="${Math.max(0,y(Math.max(v,mn))-yt)}"/><line class="bandl" style="--c:${COL[l]}" x1="${L}" x2="${L+cw*n}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+3}" text-anchor="end" style="fill:${COL[l]}">${fTn(v)}°</text>`}).join("");
  const hiPath=days.map((d,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(d.hi).toFixed(1)}`).join(""),loPath=days.map((d,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(d.lo).toFixed(1)}`).join("");
  const area=hiPath+days.map((d,i)=>`L${x(n-1-i).toFixed(1)},${y(days[n-1-i].lo).toFixed(1)}`).join("")+"Z";
  let len=0;for(let i=1;i<n;i++)len+=Math.hypot(x(i)-x(i-1),y(days[i].hi)-y(days[i-1].hi));
  const pts=days.map((d,i)=>`<circle class="pt" style="--c:${COL[heatLv(d.hi,sens)]}" cx="${x(i)}" cy="${y(d.hi)}" r="4.5"/><text class="v" x="${x(i)}" y="${y(d.hi)-10}" text-anchor="middle">${fTn(d.hi)}°</text><text x="${x(i)}" y="${y(d.lo)+15}" text-anchor="middle">${fTn(d.lo)}°</text>`).join("");
  const grid=days.map((d,i)=>`<line class="grid" x1="${L+cw*i}" x2="${L+cw*i}" y1="${top-14}" y2="${top+H1+170}"/>`).join("");
  const y2=top+H1+28,rh=30;
  const rows=[["uv",d=>[uvLv(d.uv),nf(d.uv)]],["air",d=>airDays&&airDays[d.tm]!=null?[aqLv(airDays[d.tm],sens),nf(airDays[d.tm])]:[4,"·"]],["storm",d=>[stormLv(d.g,0,d.c),fSpd(d.g).split(" ")[0]]],["rain",d=>[d.r>=100?2:d.r>=50?1:0,fMM(d.r).split(" ")[0]]]];
  const cells=rows.map(([k,f],ri)=>{const yy=y2+ri*(rh+4);return `<text class="rl" x="0" y="${yy+rh/2+4}">${esc(s.calRows[k])}</text>`+days.map((d,i)=>{const [l,v]=f(d);return `<rect class="cell" style="--c:${COL[l]}" x="${L+cw*i+2}" y="${yy}" width="${cw-4}" height="${rh}" rx="2"/><rect class="cellb" style="--c:${COL[l]}" x="${L+cw*i+2}" y="${yy+rh-3}" width="${cw-4}" height="3"/><text class="v" x="${x(i)}" y="${yy+rh/2+3}" text-anchor="middle">${v}</text>`}).join("")}).join("");
  const unitsK=units==="i"?"mph · in":"km/h · mm";
  const head=days.map((d,i)=>`<text class="dl" x="${x(i)}" y="10" text-anchor="middle">${esc(fDate(d.tm,{weekday:"short"}))} ${esc(fDate(d.tm,{day:"numeric"}))}</text>`).join("");
  const Ht=y2+rows.length*(rh+4)+4;
  return `<div class="days"><div class="sh"><h3>${esc(s.cal)}</h3><span class="k">${esc(fill(s.calK,{u:units==="i"?"°F":"°C"}))} · ${unitsK}</span></div>
  <div class="chart"><svg width="${Wd}" height="${Ht}" viewBox="0 0 ${Wd} ${Ht}" role="img" aria-label="${esc(s.cal)}">${grid}${bands}<path class="range" d="${area}"/><path class="lo" d="${loPath}"/><path class="hi" d="${hiPath}" style="--len:${len.toFixed(0)}"/>${pts}${head}<text class="rl" x="0" y="${top+10}">${esc(s.calRows.heat)}</text>${cells}</svg></div></div>`;
}
let io;

  io&&io.disconnect();io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{rootMargin:"0px 0px -40px 0px"});

function syncURL(){

function toast(m){const e=$("toast");e.textContent=m;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1800)}

/* ---------- globe ---------- */
const GEO=window.SaluGeo,cv=$("globe"),ctx=cv.getContext("2d");
let rot=[-10,-25,0],target=null,qk=[],col={},pulse0=performance.now(),dragging=false,visible=true,idle=true;
const proj=GEO.geoOrthographic().clipAngle(90).precision(.4),path=GEO.geoPath(proj,ctx),grat=GEO.geoGraticule10();
function readColors(){const cs=getComputedStyle(document.documentElement);["--ocean","--land","--coast","--rule","--rule2","--ink","--cobalt","--night","--l3","--paper","--mute"].forEach(k=>col[k]=cs.getPropertyValue(k).trim())}
function sunPos(){const now=new Date(),start=Date.UTC(now.getUTCFullYear(),0,0),doy=(now-start)/DAY,dec=-23.44*Math.cos(2*Math.PI/365*(doy+10)),h=now.getUTCHours()+now.getUTCMinutes()/60;return [-15*(h-12),dec]}
function drawGlobe(){
  const dpr=Math.min(devicePixelRatio||1,2),w=cv.clientWidth;if(!w)return;
  if(cv.width!==Math.round(w*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(w*dpr)}
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,w);
  const r=w/2-6;proj.scale(r).translate([w/2,w/2]).rotate(rot);
  // ocean
  ctx.beginPath();path({type:"Sphere"});ctx.fillStyle=col["--ocean"];ctx.fill();
  ctx.beginPath();path(grat);ctx.strokeStyle=col["--rule2"];ctx.lineWidth=.5;ctx.stroke();
  ctx.beginPath();path(GEO.land);ctx.fillStyle=col["--land"];ctx.fill();ctx.strokeStyle=col["--coast"];ctx.lineWidth=.7;ctx.stroke();
  // night side
  const [sl,sd]=sunPos();ctx.beginPath();path(GEO.geoCircle().center([sl+180,-sd]).radius(90)());ctx.fillStyle=col["--night"];ctx.fill();
  // rim + outer ticks
  ctx.beginPath();path({type:"Sphere"});ctx.strokeStyle=col["--ink"];ctx.lineWidth=1.2;ctx.stroke();
  ctx.save();ctx.translate(w/2,w/2);ctx.strokeStyle=col["--mute"];ctx.lineWidth=.8;for(let i=0;i<72;i++){const a=i/72*Math.PI*2,l=i%6===0?7:3;ctx.beginPath();ctx.moveTo(Math.cos(a)*(r+1),Math.sin(a)*(r+1));ctx.lineTo(Math.cos(a)*(r+1+l*.7),Math.sin(a)*(r+1+l*.7));ctx.stroke()}ctx.restore();
  if(target){
    // 300 km quake search ring
    ctx.beginPath();path(GEO.geoCircle().center(target).radius(300/111.2)());ctx.setLineDash([3,3]);ctx.strokeStyle=col["--ink"];ctx.lineWidth=.9;ctx.stroke();ctx.setLineDash([]);
    qk.forEach(q=>{if(GEO.geoDistance([q.lon,q.lat],[-rot[0],-rot[1]])>Math.PI/2)return;const [x,y]=proj([q.lon,q.lat]);ctx.beginPath();ctx.arc(x,y,1.5+Math.max(0,q.m-4)*2.2,0,7);ctx.strokeStyle=col["--l3"];ctx.lineWidth=1.3;ctx.stroke()});
    if(GEO.geoDistance(target,[-rot[0],-rot[1]])<Math.PI/2){const [x,y]=proj(target);
      const ph=((performance.now()-pulse0)%2200)/2200;
      if(!RM){ctx.beginPath();ctx.arc(x,y,6+ph*26,0,7);ctx.strokeStyle=col["--cobalt"];ctx.globalAlpha=1-ph;ctx.lineWidth=1.5;ctx.stroke();ctx.globalAlpha=1}
      ctx.strokeStyle=col["--ink"];ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x-16,y);ctx.lineTo(x-5,y);ctx.moveTo(x+5,y);ctx.lineTo(x+16,y);ctx.moveTo(x,y-16);ctx.lineTo(x,y-5);ctx.moveTo(x,y+5);ctx.lineTo(x,y+16);ctx.stroke();
      ctx.beginPath();ctx.arc(x,y,3.2,0,7);ctx.fillStyle=col["--cobalt"];ctx.fill();}
  }
}
let fly=null;
function flyTo(lon,lat){
  target=[lon,lat];idle=false;$("gcoord").textContent=fLat(lat,lon);
  const from=[-rot[0],-rot[1]],to=[lon,lat],ip=GEO.geoInterpolate(from,to),dist=GEO.geoDistance(from,to);
  if(RM||!visible){rot=[-lon,-lat,0];drawGlobe();return}

}
function setGlobeQuakes(a){qk=a||[];drawGlobe()}
let raf=0;
function frame(now){
  raf=0;
  if(fly){const k=Math.min(1,(now-fly.t0)/fly.dur),e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2,[lo,la]=fly.ip(e);rot=[-lo,-la,0];if(k>=1)fly=null}
  else if(idle&&!dragging&&!RM)rot=[rot[0]+.06,rot[1],0];
  $("gtick").textContent=fLat(-rot[1],((-rot[0]%360)+540)%360-180);
  drawGlobe();
  if(visible&&(fly||idle||target)&&!RM)kick();
}
function kick(){if(!raf)raf=requestAnimationFrame(frame)}
// drag to spin
let p0=null;
cv.addEventListener("pointerdown",e=>{dragging=true;p0={x:e.clientX,y:e.clientY,r:[...rot]};cv.setPointerCapture(e.pointerId);fly=null});
cv.addEventListener("pointermove",e=>{if(!dragging)return;const k=180/(cv.clientWidth*1.1);rot=[p0.r[0]+(e.clientX-p0.x)*k,Math.max(-80,Math.min(80,p0.r[1]-(e.clientY-p0.y)*k)),0];kick()});
const endDrag=()=>{dragging=false};cv.addEventListener("pointerup",endDrag);cv.addEventListener("pointercancel",endDrag);

if("IntersectionObserver" in window)new IntersectionObserver(es=>{visible=es[0].isIntersecting;if(visible)kick()}).observe(cv);
addEventListener("resize",()=>{drawGlobe()});
matchMedia("(prefers-color-scheme:dark)").addEventListener?.("change",()=>{readColors();drawGlobe()});

/* ---------- boot ---------- */

else{const e=EX[0];check({name:e[0],admin1:"",lat:e[1],lon:e[2],cc:e[3],ex:e[0]})}
})();
