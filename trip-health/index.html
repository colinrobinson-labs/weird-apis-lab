<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Salu Atlas</title>
<meta name="description" content="Free travel health check for any city: heat, UV, air, pollen, storms, ocean, altitude, earthquakes, travel advisories and outbreaks, with what to do about each.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+JP:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f3f0e8;--panel:#fffdf8;--line:#e0dacb;--fg:#1b211f;--muted:#5d6763;--accent:#1f6f5c;--ink2:#2b3431;
  --l0:#2f8f5b;--l1:#b98600;--l2:#d0612a;--l3:#c2283f;--nd:#8a918e;
  --display:"Fraunces",Georgia,serif;--body:"IBM Plex Sans","IBM Plex Sans JP",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1311;--panel:#151c19;--line:#26312c;--fg:#e9f0ec;--muted:#98a6a0;--accent:#63d4ab;--ink2:#cfd9d4;--l0:#5fd18f;--l1:#f0c341;--l2:#ff8a52;--l3:#ff5c74;--nd:#7d8a85;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1311;--panel:#151c19;--line:#26312c;--fg:#e9f0ec;--muted:#98a6a0;--accent:#63d4ab;--ink2:#cfd9d4;--l0:#5fd18f;--l1:#f0c341;--l2:#ff8a52;--l3:#ff5c74;--nd:#7d8a85;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--body)}
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto;padding-block:20px 64px}
a{color:var(--accent)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font:900 26px var(--display);letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand svg{width:26px;height:26px}
.brand span{color:var(--accent)}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button,input,select{font:500 14px var(--body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
button{cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;border-radius:0;font:500 12px var(--mono);padding:6px 9px;background:transparent}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hero{margin:34px 0 16px;display:grid;gap:10px}
.hero h1{font:900 clamp(32px,6vw,62px)/1 var(--display);letter-spacing:-.025em;margin:0;text-wrap:balance;max-width:16ch}
:lang(ja) .hero h1{max-width:none;font-size:clamp(28px,5vw,52px);line-height:1.2;letter-spacing:0;word-break:auto-phrase}
.hero p{color:var(--muted);margin:0;max-width:60ch;font-size:16px}
.form{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px;margin:18px 0 6px;box-shadow:0 1px 0 var(--line)}
.row1{display:grid;grid-template-columns:1fr auto;gap:10px}
@media (max-width:640px){.row1{grid-template-columns:1fr}}
.search{position:relative}
.search input{width:100%;font-size:17px;padding:13px 14px}
.sugg{position:absolute;top:100%;left:0;right:0;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-top:4px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.sugg button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:11px 14px}
.sugg button:last-child{border-bottom:0}
.sugg button[aria-selected="true"],.sugg button:hover{background:color-mix(in srgb,var(--accent) 12%,var(--panel))}
.sugg small{color:var(--muted);font:12px var(--mono)}
.dates{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.dates label{display:grid;gap:3px;font:11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.dates input{padding:11px 10px;min-width:0}
.toggles{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.toggles label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 11px;background:var(--bg);cursor:pointer;color:var(--fg)}
.toggles label:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--panel))}
.toggles input{accent-color:var(--accent);margin:0}
.examples{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted);margin-top:8px}
.examples button{font-size:13px;padding:4px 10px;border-radius:999px;background:transparent}
.dest{display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap;margin:30px 0 10px}
.dest h2{font:900 clamp(28px,5vw,44px)/1.02 var(--display);margin:0;letter-spacing:-.02em}
.dest .sub{color:var(--muted);font:12px var(--mono);margin-top:6px}
.ovr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{font:600 15px var(--body);padding:8px 16px;border-radius:999px;color:#fff;background:var(--c)}
:root[data-theme="dark"] .pill,.dark .pill{color:#0e1311}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill{color:#0e1311}}
.ovr .lbl{font:12px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.acts{display:flex;gap:6px}
.acts button{font-size:13px;padding:7px 11px}
.note{font:13px var(--body);color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:9px 12px;margin:8px 0}
.banner{border:2px solid var(--l3);background:color-mix(in srgb,var(--l3) 9%,var(--panel));border-radius:12px;padding:12px 14px;margin:10px 0}
.top3{background:var(--fg);color:var(--bg);border-radius:14px;padding:16px 18px;margin:12px 0}
.top3 h3{font:700 20px var(--display);margin:0 0 8px}
.top3 ol{margin:0;padding-left:20px;display:grid;gap:4px}
.top3 li::marker{font:600 13px var(--mono)}
.top3 .lvdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:1px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font:12px var(--mono);color:var(--muted);margin:16px 0 10px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:12px;padding:14px 15px;display:flex;flex-direction:column;gap:7px;min-width:0;animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
.card .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card .n{font:700 17px var(--display)}
.card .lv{font:600 11px var(--mono);color:var(--c);white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
.card .v{font-size:15px;color:var(--ink2)}
.card .v small{display:block;color:var(--muted);font-size:13px}
.card ul{margin:0;padding-left:18px;font-size:14px;display:grid;gap:2px}
.card .ext{font-size:13px;color:var(--muted);margin:0;padding-left:18px}
.card .m{margin-top:auto;border-top:1px dashed var(--line);padding-top:7px;display:flex;justify-content:space-between;gap:8px;font:11px var(--mono);color:var(--muted)}
.card .m a{color:var(--muted)}
.grade{border:1px solid currentColor;border-radius:4px;padding:0 5px;font-weight:600}
.cal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:14px 0;overflow-x:auto}
.cal h3{font:700 18px var(--display);margin:0 0 8px}
.cal table{border-collapse:separate;border-spacing:3px;font:11px var(--mono)}
.cal th{color:var(--muted);font-weight:500;text-align:left;padding-right:6px;white-space:nowrap}
.cal td{min-width:46px;height:34px;border-radius:6px;text-align:center;background:color-mix(in srgb,var(--c) 22%,var(--panel));border-bottom:3px solid var(--c);color:var(--fg)}
.cal thead th{text-align:center}
.side{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin-top:14px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 15px}
.box h3{font:700 18px var(--display);margin:0 0 6px}
.box p{margin:0 0 8px;color:var(--muted);font-size:14px}
.box ul{margin:0;padding-left:18px;font-size:14px}
.nums{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0}
.num{border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:100px}
.num b{display:block;font:700 26px var(--mono);color:var(--l3)}
.num span{font-size:12px;color:var(--muted)}
.loading{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));margin-top:26px}
.sk{height:150px;border-radius:12px;background:linear-gradient(90deg,var(--panel),color-mix(in srgb,var(--line) 60%,var(--panel)),var(--panel));background-size:200% 100%;animation:sh 1.2s linear infinite;border:1px solid var(--line)}
@keyframes sh{to{background-position:-200% 0}}
.grp{font:700 22px var(--display);margin:26px 0 10px;letter-spacing:-.01em}
.clear{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.clear details{border-bottom:1px solid var(--line)}.clear details:last-child{border-bottom:0}
.clear summary{display:grid;grid-template-columns:150px 1fr auto;gap:12px;align-items:baseline;padding:11px 15px;cursor:pointer;list-style:none}
.clear summary::-webkit-details-marker{display:none}
.clear summary .n{font:700 15px var(--display);display:flex;align-items:center;gap:8px}
.clear summary .n::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.clear summary .cv{color:var(--muted);font-size:14px}.clear summary .cv small{display:inline;margin-left:6px}
.clear summary .grade{font:600 11px var(--mono);color:var(--muted)}
.clear .cd{padding:0 15px 12px 31px;font-size:14px}.clear .cd ul{margin:0 0 6px;padding-left:18px}.clear .m{font:11px var(--mono);color:var(--muted)}.clear .m a{color:var(--muted)}
@media (max-width:640px){
 .top{flex-direction:column;align-items:stretch}.tools{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px}
 #langs{overflow-x:auto;scrollbar-width:none}#langs button{flex:none}
 .hero{margin-top:22px}.hero p{font-size:15px}
 .form{padding:12px;border-radius:12px}
 .dates{display:grid;grid-template-columns:1fr 1fr}.dates input{width:100%}
 .toggles{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin-inline:-12px;padding-inline:12px;scrollbar-width:none}
 .toggles label,.toggles span{white-space:nowrap;flex:none}
 .examples{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.examples button,.examples span{flex:none}
 .dest{margin-top:22px}.ovr{width:100%;justify-content:space-between}
 .acts{width:100%}.acts button{flex:1}
 .top3{padding:14px}.top3 h3{font-size:18px}
 .cards{grid-template-columns:1fr}
 .clear summary{grid-template-columns:1fr auto;gap:2px 10px}.clear summary .cv{grid-column:1/-1;grid-row:2;padding-left:16px}
 .cal{margin-inline:-4px}
}
.method{margin-top:44px;display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));border-top:1px solid var(--line);padding-top:20px}
.method h3{font:700 20px var(--display);margin:0 0 6px}
.method p{color:var(--muted);font-size:14px;margin:0}
footer{margin-top:28px;font:12px var(--mono);color:var(--muted)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media print{.tools,.form,.examples,.acts,.method,.hero p{display:none!important}.card,.box,.cal{break-inside:avoid}body{background:#fff}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M16 7v18M7 16h18" stroke="var(--accent)" stroke-width="4" stroke-linecap="round"/></svg>Salu<span>Atlas</span></div>
    <div class="tools">
      <div class="seg" id="units" role="group" aria-label="Units"><button data-u="m">°C</button><button data-u="i">°F</button></div>
      <div class="seg" id="langs" role="group" aria-label="Language"></div>
      <div class="seg"><button id="theme" aria-label="Theme">◐</button></div>
    </div>
  </div>

  <div class="hero">
    <h1 data-t="hero"></h1>
    <p data-t="sub"></p>
  </div>

  <div class="form">
    <div class="row1">
      <div class="search">
        <input id="q" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="sugg" aria-autocomplete="list">
        <div class="sugg" id="sugg" role="listbox" hidden></div>
      </div>
      <div class="dates" role="group">
        <label><span data-t="from"></span><input type="date" id="d1"></label>
        <label><span data-t="to"></span><input type="date" id="d2"></label>
      </div>
    </div>
    <div class="toggles" id="toggles">
      <span data-t="forT"></span>
      <label><input type="checkbox" value="kids"><span data-g="kids"></span></label>
      <label><input type="checkbox" value="older"><span data-g="older"></span></label>
      <label><input type="checkbox" value="pregnant"><span data-g="pregnant"></span></label>
      <label><input type="checkbox" value="lungs"><span data-g="lungs"></span></label>
      <label><input type="checkbox" value="allergy"><span data-g="allergy"></span></label>
    </div>
  </div>
  <div class="examples" id="examples"><span data-t="tryT"></span></div>

  <div id="result" aria-live="polite"></div>

  <section class="method">
    <div><h3 data-t="howT"></h3><p data-th="howP"></p></div>
    <div><h3 data-t="gradeT"></h3><p data-th="gradeP"></p></div>
    <div><h3 data-t="nextT"></h3><p data-t="nextP"></p></div>
  </section>
  <footer data-t="foot"></footer>
</div>
<div class="toast" id="toast"></div>

<script src="i18n.js"></script>
<script>
(()=>{
const T=window.SALU_T,$=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fill=(s,o)=>s.replace(/\{(\w+)\}/g,(_,k)=>o[k]??"");
const COL=["var(--l0)","var(--l1)","var(--l2)","var(--l3)","var(--nd)"];
const DAY=864e5,iso=d=>d.toISOString().slice(0,10),addD=(s,n)=>iso(new Date(Date.parse(s)+n*DAY)),daysBetween=(a,b)=>Math.round((Date.parse(b)-Date.parse(a))/DAY);
const TODAY=iso(new Date());
const P=new URLSearchParams(location.search);
let lang=P.get("lang")||(navigator.language||"en").slice(0,2);if(!T[lang])lang="en";
let units=P.get("u")||((navigator.language||"")==="en-US"?"i":"m");
let last=null;
const t=()=>T[lang];

/* ---------- units & formatting ---------- */
const nf=(n,d=0)=>Number(n).toLocaleString(lang,{maximumFractionDigits:d,minimumFractionDigits:d});
const fT=c=>units==="i"?`${nf(c*9/5+32)}°F`:`${nf(c)}°C`;
const fSpd=k=>units==="i"?`${nf(k*.6214)} mph`:`${nf(k)} km/h`;
const fMM=mm=>units==="i"?`${nf(mm/25.4,1)} in`:`${nf(mm)} mm`;
const fM=m=>units==="i"?`${nf(m*3.281)} ft`:`${nf(m)} m`;
const fWave=m=>units==="i"?`${nf(m*3.281,1)} ft`:`${nf(m,1)} m`;
const fKm=k=>units==="i"?`${nf(k*.6214)} mi`:`${nf(k)} km`;
const fDate=(s,o={month:"short",day:"numeric"})=>new Intl.DateTimeFormat(lang,{...o,timeZone:"UTC"}).format(new Date(s+"T00:00:00Z"));
const region=(cc,l)=>{try{return new Intl.DisplayNames([l],{type:"region"}).of(cc)}catch(_){return cc}};

/* ---------- static UI ---------- */
function applyLang(){
  const s=t();document.documentElement.lang=lang;document.title=s.title;
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=s[e.dataset.t]);
  document.querySelectorAll("[data-th]").forEach(e=>e.innerHTML=s[e.dataset.th]);
  document.querySelectorAll("[data-g]").forEach(e=>e.textContent=s.g[e.dataset.g]);
  $("q").placeholder=s.ph;document.querySelectorAll("[data-ex]").forEach(b=>b.textContent=exName(b.dataset.ex));
  [...$("langs").children].forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
  if(last&&last.cards)render();
}
Object.keys(T).forEach(k=>{const b=document.createElement("button");b.dataset.l=k;b.textContent=T[k].n;b.onclick=()=>{lang=k;applyLang();syncURL()};$("langs").appendChild(b)});
document.querySelectorAll("#units button").forEach(b=>b.onclick=()=>{units=b.dataset.u;markUnits();if(last&&last.cards)render();syncURL()});
const markUnits=()=>document.querySelectorAll("#units button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.u===units));
$("theme").onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dark?"light":"dark"};

$("d1").value=P.get("s")||TODAY;$("d2").value=P.get("e")||addD(TODAY,6);$("d1").min=TODAY;$("d2").min=TODAY;
const fixDates=()=>{if($("d2").value<$("d1").value)$("d2").value=$("d1").value;if(daysBetween($("d1").value,$("d2").value)>29)$("d2").value=addD($("d1").value,29)};
["d1","d2"].forEach(id=>$(id).onchange=()=>{fixDates();last&&check(last.place)});
(P.get("g")||"").split(",").forEach(g=>{const i=document.querySelector(`#toggles input[value="${g}"]`);if(i)i.checked=true});
document.querySelectorAll("#toggles input").forEach(i=>i.onchange=()=>last&&check(last.place));
const groups=()=>new Set([...document.querySelectorAll("#toggles input:checked")].map(i=>i.value));
const sensitive=g=>g.has("kids")||g.has("older")||g.has("pregnant")||g.has("lungs");

const get=async u=>{const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json()};

/* ---------- search with keyboard nav ---------- */
let timer,sel=-1,results=[];
function showSugg(){const s=$("sugg");s.innerHTML="";results.forEach((r,i)=>{const b=document.createElement("button");b.setAttribute("role","option");b.setAttribute("aria-selected",i===sel);b.innerHTML=`<span>${esc(r.name)}${r.admin1?", "+esc(r.admin1):""}</span><small>${esc(region(r.country_code,lang)||r.country||"")}</small>`;b.onmousedown=e=>{e.preventDefault();pick(r)};s.appendChild(b)});
  if(!results.length&&$("q").value.trim().length>=2){s.innerHTML=`<button disabled>${esc(t().noRes)}</button>`}
  s.hidden=!s.children.length;$("q").setAttribute("aria-expanded",!s.hidden)}
function pick(r){$("sugg").hidden=true;$("q").value=`${r.name}${r.admin1?", "+r.admin1:""}`;check({name:r.name,admin1:r.admin1||"",lat:r.latitude,lon:r.longitude,cc:r.country_code})}
$("q").addEventListener("input",e=>{clearTimeout(timer);const v=e.target.value.trim();if(v.length<2){$("sugg").hidden=true;return}
  timer=setTimeout(async()=>{try{const j=await get(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(v)}&count=7&language=${lang}`);results=(j.results||[]).filter(r=>r.country_code);sel=-1;showSugg()}catch(_){}},220)});
$("q").addEventListener("keydown",e=>{if($("sugg").hidden)return;if(e.key==="ArrowDown"){sel=Math.min(sel+1,results.length-1);showSugg();e.preventDefault()}else if(e.key==="ArrowUp"){sel=Math.max(sel-1,0);showSugg();e.preventDefault()}else if(e.key==="Enter"){const r=results[sel<0?0:sel];if(r)pick(r)}else if(e.key==="Escape")$("sugg").hidden=true});
$("q").addEventListener("blur",()=>setTimeout(()=>$("sugg").hidden=true,150));

const EX=[["Bangkok",13.75,100.50,"TH",""],["Cusco",-13.53,-71.97,"PE",""],["Delhi",28.65,77.23,"IN",""],["Reykjavík",64.14,-21.90,"IS",""],["Lisbon",38.72,-9.14,"PT",""],["Mexico City",19.43,-99.13,"MX",""]];

async function weather(p,W,G){

     <div class="h"><span class="n">${esc(s.names[c.k])}</span><span class="lv">${esc(s.lv[c.level])}</span></div>
     <div class="v">${c.v}</div>${c.x||""}<ul>${c.a.map(k=>`<li>${esc(s.a[k])}</li>`).join("")}</ul>
     <div class="m"><span>${esc(s.src)}: <a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.src)}</a></span><span>${esc(c.when)} <span class="grade" title="${esc(s.rel)}">${c.g}</span></span></div></article>`).join("")}</div>
   ${ranked.some(c=>c.level===0)?`<h3 class="grp">${esc(s.clear)}</h3><div class="clear">${ranked.filter(c=>c.level===0).map(c=>`<details style="--c:${COL[0]}"><summary><span class="n">${esc(s.names[c.k])}</span><span class="cv">${c.v}</span><span class="grade" title="${esc(s.rel)}">${c.g}</span></summary><div class="cd">${c.x||""}<ul>${c.a.map(k=>`<li>${esc(s.a[k])}</li>`).join("")}</ul><div class="m">${esc(s.src)}: <a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.src)}</a> · ${esc(c.when)}</div></div></details>`).join("")}</div>`:""}
   <div class="side">
     <div class="box"><h3>${esc(s.emergT)}</h3>${emerg}</div>
     <div class="box"><h3>${esc(s.guideT)}</h3><p>${esc(s.guideP)}</p><ul>
       ${fc?`<li><a href="https://www.gov.uk/foreign-travel-advice/${fc}/health" target="_blank" rel="noopener">${esc(s.guideFCDO)}</a></li>`:""}
       ${cdc?`<li><a href="https://wwwnc.cdc.gov/travel/destinations/traveler/none/${cdc}" target="_blank" rel="noopener">${esc(s.guideCDC)}</a></li>`:""}
       <li><a href="https://travelhealthpro.org.uk/countries" target="_blank" rel="noopener">${esc(s.guideTHP)}</a></li></ul></div>
   </div>`;
  $("bShare").onclick=async()=>{try{await navigator.clipboard.writeText(location.href);toast(s.copied)}catch(_){prompt("",location.href)}};
  $("bPrint").onclick=()=>print();
}
function calendar(){
  const {days,airDays}=last,s=t();if(!days||!days.length)return"";
  const sens=sensitive(groups());
  const cell=(l,txt)=>`<td style="--c:${COL[l]}">${txt}</td>`;
  const rows=[
    ["heat",d=>cell(heatLv(d.hi,sens),fT(d.hi))],
    ["uv",d=>cell(uvLv(d.uv??0),nf(d.uv??0))],
    ["air",d=>airDays&&airDays[d.tm]!=null?cell(aqLv(airDays[d.tm],sens),nf(airDays[d.tm])):cell(4,"·")],
    ["storm",d=>cell(stormLv(d.g,d.r,d.c),fSpd(d.g).split(" ")[0])]
  ];
  return `<div class="cal"><h3>${esc(s.cal)}</h3><table><thead><tr><th></th>${days.map(d=>`<th>${fDate(d.tm,{weekday:"short"})}<br>${fDate(d.tm,{day:"numeric"})}</th>`).join("")}</tr></thead><tbody>${rows.map(([k,f])=>`<tr><th>${esc(s.calRows[k])}</th>${days.map(f).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function syncURL(){
  const q=new URLSearchParams();q.set("lang",lang);q.set("u",units);
  if(last){const p=last.place;q.set("lat",p.lat.toFixed(4));q.set("lon",p.lon.toFixed(4));q.set("n",p.name);if(p.admin1)q.set("a",p.admin1);q.set("cc",p.cc);q.set("s",$("d1").value);q.set("e",$("d2").value);const g=[...groups()].join(",");if(g)q.set("g",g)}
  history.replaceState(null,"","?"+q.toString());
}
function toast(m){const e=$("toast");e.textContent=m;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1600)}

/* re-render with fresh text when language or units change: card values are built at check time, so re-run checks */
const _render=render;
render=function(){ if(last&&last.cards&&(last.lang!==lang||last.units!==units)&&last.lang){last.lang=lang;last.units=units;check(last.place);return} if(last){last.lang=lang;last.units=units} _render(); };

markUnits();applyLang();
if(!P.get("lat")){const e=EX[4];const nm=exName(e[0]);check({name:nm,admin1:"",lat:e[1],lon:e[2],cc:e[3]})}
if(P.get("lat")&&P.get("cc")){const p={name:P.get("n")||"",admin1:P.get("a")||"",lat:+P.get("lat"),lon:+P.get("lon"),cc:P.get("cc")};$("q").value=p.name;check(p)}
})();
</script>
