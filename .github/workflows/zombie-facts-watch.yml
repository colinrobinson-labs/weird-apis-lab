name: Zombie Facts watch
# Daily: re-check open cases + read talk-page replies, then redeploy.
# On feature branches: run the tests and a dry recheck (no commit), and upload the
# wikitext around every open citation for review.
on:
  schedule:
    - cron: "15 14 * * *"   # daily
  workflow_dispatch:
    inputs:
      post:
        description: "Also post approved notes (needs WIKI_USER / WIKI_PASS secrets)"
        type: boolean
        default: false
  push:
    branches-ignore: [main]
    paths: ["zombie-facts/**", ".github/workflows/zombie-facts-*.yml"]
permissions:
  contents: write
  actions: write
concurrency: zombie-facts-data
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Unit tests
        run: python -m unittest discover -v zombie-facts/build/tests
      - name: Page script parses
        run: |
          python - <<'PY'
          import re
          s = open("zombie-facts/index.html").read()
          js = "\n".join(re.findall(r"<script>(.*?)</script>", s, re.S))
          open("/tmp/page.js", "w").write(js)
          PY
          node --check /tmp/page.js
      - name: JSON files parse
        run: for f in zombie-facts/*.json; do python -m json.tool "$f" > /dev/null && echo "ok $f"; done
  watch:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Post approved notes
        if: github.event_name == 'workflow_dispatch' && inputs.post
        env:
          WIKI_USER: ${{ secrets.WIKI_USER }}
          WIKI_PASS: ${{ secrets.WIKI_PASS }}
        run: python zombie-facts/build/post_notes.py
      - name: Recheck open cases and talk pages
        env:
          ZF_DUMP_CONTEXT: ${{ github.ref != 'refs/heads/main' && '/tmp/contexts.json' || '' }}
        run: python zombie-facts/build/recheck.py
      - name: Upload review contexts
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: zombie-facts-review
          path: |
            /tmp/contexts.json
            zombie-facts/data.json
            zombie-facts/outreach.json
          if-no-files-found: ignore
      - name: Commit and redeploy
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "zombie-facts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add zombie-facts/data.json zombie-facts/outreach.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Zombie Facts: daily recheck"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break; sleep $((i*5)); done
          gh workflow run pages.yml --ref main
