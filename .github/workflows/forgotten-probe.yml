name: Forgotten probe (temporary)
on:
  push:
    branches: [claude/project-thread-0hm42t]
    paths: ["forgotten/build/debug/*.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python forgotten/build/debug/caseload_probe.py
      - run: |
          git config user.name "forgotten-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forgotten/build/debug; git commit -m "forgotten: probe output [skip ci]"
          for i in 1 2 3; do git pull --rebase origin "$GITHUB_REF_NAME" && git push && break; sleep 5; done
